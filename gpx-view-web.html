<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GPX View Web</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Standard PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">

  <style>
    body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    #sidebar { width: 350px; border-right: 1px solid #ccc; display: flex; flex-direction: column; background: #fff; z-index: 1000; }
    #controls { padding: 12px; background: #f8f9fa; border-bottom: 1px solid #ddd; }
    .btn-row { display: flex; gap: 8px; margin-bottom: 8px; }
    button { flex: 1; padding: 8px 12px; font-weight: 600; font-size: 13px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
    button:hover { background: #e9ecef; }
    button.active { background: #0d6efd; color: white; border-color: #0d6efd; }
    #btn-install { background: #198754; color: white; border-color: #198754; display: none; }
    #btn-install:hover { background: #157347; }
    #status { font-size: 12px; color: #666; margin-top: 4px; }
    #file-list { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
    #file-list li { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 13px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: background 0.15s ease; }
    #file-list li:hover { background: #f1f3f5; }
    #file-list li.active-file { background: #0d6efd; color: white; }
    .file-header { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .color-swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.2); }
    #file-list li.active-file .color-swatch { border-color: #fff; }
    .track-details { font-size: 11px; margin-top: 4px; padding-top: 6px; border-top: 1px dashed rgba(0,0,0,0.15); display: flex; flex-direction: column; gap: 2px; }
    #file-list li.active-file .track-details { border-top-color: rgba(255,255,255,0.3); opacity: 0.95; }
    #map { flex: 1; height: 100%; }
  </style>
</head>
<body>

<div id="sidebar">
  <div id="controls">
    <div class="btn-row">
      <button id="btn-select">Select Folder</button>
      <button id="btn-freeze" disabled>Freeze View</button>
    </div>
    <div class="btn-row">
      <button id="btn-install">⚡ Install App</button>
    </div>
    <div id="status">No folder loaded</div>
  </div>
  <ul id="file-list"></ul>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // 1. Register Physical Service Worker & Handle Install Prompt
  let deferredPrompt;
  const installBtn = document.getElementById('btn-install');

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registered successfully.'))
        .catch(err => console.error('Service Worker registration failed:', err));
    });
  }

  // Intercept the native install prompt and surface the "Install App" button
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      installBtn.style.display = 'none';
    }
    deferredPrompt = null;
  });

  window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
    console.log('GPX View Web was installed');
  });

  // 2. Map Setup & Tile Layers
  const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  });

  const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Tiles © Esri'
  });

  const map = L.map('map', {
    center: [36.1699, -115.1398],
    zoom: 10,
    layers: [osmLayer]
  });

  L.control.layers({
    "Default Map": osmLayer,
    "Satellite View": satelliteLayer
  }).addTo(map);

  // App State
  const fileCache = [];
  const activeLayersGroup = L.layerGroup().addTo(map);
  let isFrozen = false;
  let selectedItem = null;

  // 3. Distance & Time Calculations
  function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
    const R = 3958.8; // Miles
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = 
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function formatDuration(seconds) {
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);
    const parts = [];
    if (hrs > 0) parts.push(`${hrs}h`);
    if (mins > 0 || hrs > 0) parts.push(`${mins}m`);
    parts.push(`${secs}s`);
    return parts.join(' ');
  }

  // 4. Color Generator
  function generateColor(index, total) {
    const hue = Math.floor((index * (360 / Math.max(total, 1))) % 360);
    return `hsl(${hue}, 85%, 45%)`;
  }

  // 5. Highlight Track Logic
  function selectTrack(item) {
    if (selectedItem) {
      selectedItem.polyline.setStyle({ weight: 3, opacity: 0.85 });
      if (selectedItem.listEl) {
        selectedItem.listEl.classList.remove('active-file');
        const detailsBox = selectedItem.listEl.querySelector('.track-details');
        if (detailsBox) detailsBox.remove();
      }
    }

    selectedItem = item;

    if (item) {
      item.polyline.setStyle({ weight: 6, opacity: 1.0 });
      item.polyline.bringToFront();

      if (item.listEl) {
        item.listEl.classList.add('active-file');
        
        const detailsEl = document.createElement('div');
        detailsEl.className = 'track-details';
        detailsEl.innerHTML = `
          <div><b>Start:</b> ${item.meta.startTime}</div>
          <div><b>Distance:</b> ${item.meta.distance}</div>
          <div><b>Duration:</b> ${item.meta.duration}</div>
        `;
        item.listEl.appendChild(detailsEl);
        item.listEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }
  }

  map.on('click', () => selectTrack(null));

  // 6. Freeze Button Handler
  const freezeBtn = document.getElementById('btn-freeze');
  freezeBtn.addEventListener('click', () => {
    isFrozen = !isFrozen;
    if (isFrozen) {
      freezeBtn.classList.add('active');
      freezeBtn.innerText = 'Unfreeze View';
    } else {
      freezeBtn.classList.remove('active');
      freezeBtn.innerText = 'Freeze View';
      updateVisibleTracks();
    }
  });

  // 7. Folder Picker Handler
  document.getElementById('btn-select').addEventListener('click', async () => {
    try {
      const dirHandle = await window.showDirectoryPicker();
      document.getElementById('status').innerText = 'Indexing folder...';
      fileCache.length = 0;
      activeLayersGroup.clearLayers();
      selectedItem = null;
      isFrozen = false;
      freezeBtn.classList.remove('active');
      freezeBtn.innerText = 'Freeze View';

      const entries = [];
      for await (const entry of dirHandle.values()) {
        if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.gpx')) {
          entries.push(entry);
        }
      }

      const totalFiles = entries.length;
      for (let i = 0; i < totalFiles; i++) {
        const color = generateColor(i, totalFiles);
        await indexGpxFile(entries[i], color);
      }

      document.getElementById('status').innerText = `Indexed ${fileCache.length} GPX files`;
      freezeBtn.disabled = fileCache.length === 0;
      updateVisibleTracks();
    } catch (err) {
      if (err.name !== 'AbortError') {
        console.error(err);
        alert('Directory access failed or not supported in this browser.');
      }
    }
  });

  // 8. Index GPX & Parse Telemetry
  async function indexGpxFile(fileHandle, color) {
    const file = await fileHandle.getFile();
    const text = await file.text();
    const parser = new DOMParser();
    const xml = parser.parseFromString(text, 'text/xml');
    
    const trkptNodes = xml.querySelectorAll('trkpt');
    if (trkptNodes.length === 0) return;

    let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
    const latLngs = [];
    let totalDistMiles = 0;

    let firstTime = null;
    let lastTime = null;

    for (let i = 0; i < trkptNodes.length; i++) {
      const lat = parseFloat(trkptNodes[i].getAttribute('lat'));
      const lng = parseFloat(trkptNodes[i].getAttribute('lon'));
      latLngs.push([lat, lng]);

      if (lat < minLat) minLat = lat;
      if (lat > maxLat) maxLat = lat;
      if (lng < minLng) minLng = lng;
      if (lng > maxLng) maxLng = lng;

      if (i > 0) {
        const prevLat = latLngs[i - 1][0];
        const prevLng = latLngs[i - 1][1];
        totalDistMiles += calculateHaversineDistance(prevLat, prevLng, lat, lng);
      }

      const timeNode = trkptNodes[i].querySelector('time');
      if (timeNode && timeNode.textContent) {
        const t = new Date(timeNode.textContent.trim());
        if (!isNaN(t.getTime())) {
          if (!firstTime) firstTime = t;
          lastTime = t;
        }
      }
    }

    const distanceStr = totalDistMiles > 0 ? `${totalDistMiles.toFixed(2)} mi` : "not available";
    const startTimeStr = firstTime ? firstTime.toLocaleString() : "not available";
    let durationStr = "not available";

    if (firstTime && lastTime && lastTime >= firstTime) {
      const elapsedSeconds = (lastTime.getTime() - firstTime.getTime()) / 1000;
      durationStr = formatDuration(elapsedSeconds);
    }

    const polyline = L.polyline(latLngs, { color: color, weight: 3, opacity: 0.85 });

    const item = {
      name: fileHandle.name,
      color: color,
      bbox: { minLat, minLng, maxLat, maxLng },
      polyline: polyline,
      meta: {
        distance: distanceStr,
        startTime: startTimeStr,
        duration: durationStr
      },
      listEl: null
    };

    polyline.on('click', (e) => {
      L.DomEvent.stopPropagation(e);
      selectTrack(item);
    });

    fileCache.push(item);
  }

  // 9. Viewport Filtering
  function updateVisibleTracks() {
    if (isFrozen) return;

    const bounds = map.getBounds();
    const mapMinLat = bounds.getSouth();
    const mapMaxLat = bounds.getNorth();
    const mapMinLng = bounds.getWest();
    const mapMaxLng = bounds.getEast();

    activeLayersGroup.clearLayers();
    const listEl = document.getElementById('file-list');
    listEl.innerHTML = '';

    fileCache.forEach(item => {
      const isVisible = !(
        item.bbox.maxLat < mapMinLat ||
        item.bbox.minLat > mapMaxLat ||
        item.bbox.maxLng < mapMinLng ||
        item.bbox.minLng > mapMaxLng
      );

      if (isVisible) {
        activeLayersGroup.addLayer(item.polyline);

        const li = document.createElement('li');
        
        const headerDiv = document.createElement('div');
        headerDiv.className = 'file-header';

        const swatch = document.createElement('span');
        swatch.className = 'color-swatch';
        swatch.style.backgroundColor = item.color;

        const nameSpan = document.createElement('span');
        nameSpan.innerText = item.name;

        headerDiv.appendChild(swatch);
        headerDiv.appendChild(nameSpan);
        li.appendChild(headerDiv);

        item.listEl = li;

        if (selectedItem === item) {
          li.classList.add('active-file');
          const detailsEl = document.createElement('div');
          detailsEl.className = 'track-details';
          detailsEl.innerHTML = `
            <div><b>Start:</b> ${item.meta.startTime}</div>
            <div><b>Distance:</b> ${item.meta.distance}</div>
            <div><b>Duration:</b> ${item.meta.duration}</div>
          `;
          li.appendChild(detailsEl);
        }

        li.onclick = (e) => {
          e.stopPropagation();
          selectTrack(item);
          map.fitBounds(item.polyline.getBounds(), { padding: [30, 30] });
        };

        listEl.appendChild(li);
      } else {
        item.listEl = null;
      }
    });
  }

  map.on('moveend', updateVisibleTracks);
</script>

</body>
</html>
